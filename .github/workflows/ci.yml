name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    # macos-15 ships Xcode 16 / Swift 6 by default; macos-14 defaults to Swift 5.10, which can't
    # build this package (Package.swift declares swift-tools-version: 6.0).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test
